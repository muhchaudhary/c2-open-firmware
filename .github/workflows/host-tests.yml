# Host unit tests (firmware/test): the hardware-independent firmware code,
# built and run on the PC with gcc and clang (ASan + UBSan). The images
# themselves: firmware.yml.
name: host tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Build and run
        run: make -C firmware/test CC=${{ matrix.cc }}
